aid: bishop-fox
name: Bishop Fox
description: >-
  Bishop Fox is an offensive security firm delivering penetration testing, red teaming, application and
  cloud security assessment, and continuous threat exposure management. Its managed Cosmos platform keeps a
  living inventory of an organization's external attack surface — domains, subdomains, DNS records, network
  ranges, IP addresses, open ports, and IP/hostname services — pairing continuous automated discovery with
  human operator validation so customers receive triaged, exploitable findings instead of scanner noise.
  Customers consume Cosmos data programmatically through the authenticated Cosmos v5 REST API at
  api.cosmos.bishopfox.com, secured with OAuth 2.0 client-credentials tokens issued by Bishop Fox's Auth0
  tenant against the cosmos_public audience, and through bi-directional Jira and ServiceNow integrations plus
  AWS, GCP, Azure, Cloudflare, and Oracle cloud connectors. Bishop Fox also publishes a widely used
  open-source offensive-security toolkit — Sliver, CloudFox, sj (Swagger Jacker), jsluice, and aimap — from
  its GitHub organization.
