apis:
- name: Bishop Fox Cosmos API (v5)
  description: >-
    Authenticated REST API for the Bishop Fox Cosmos attack-surface management platform. Exposes the
    customer's discovered asset inventory through /v5/asset-view/* resources (domains, subdomains,
    dns-records, networks, ip-addresses, ports, ip-services, hostname-services), validated findings via
    /v5/findings, and platform activity via /v5/activities. Access is by OAuth 2.0 client-credentials
    (API key + API secret exchanged for a bearer token at the Bishop Fox Auth0 tenant, audience
    cosmos_public); the reference documentation is published inside the authenticated Cosmos portal. The v1
    API was retired on 2025-12-05.
  humanURL: https://bishopfox.com/services/cosmos
  baseURL: https://api.cosmos.bishopfox.com/
